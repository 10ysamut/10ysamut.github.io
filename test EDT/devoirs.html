<script>
fetch('/sidebar.html')
  .then(res => res.text())
  .then(html => { document.getElementById('sidebar-container').innerHTML = html; })
  .catch(err => console.error('Erreur chargement sidebar :', err));

function w3_open() { document.getElementById("mySidebar").style.display="block"; document.getElementById("sidebarOverlay").style.display="block"; }
function w3_close() { document.getElementById("mySidebar").style.display="none"; document.getElementById("sidebarOverlay").style.display="none"; }
function toggleDropdown(id, btn) {
  var el = document.getElementById(id);
  var isOpen = el.style.display === "block";
  document.querySelectorAll('.dropdown-container').forEach(function(d) { d.style.display="none"; });
  document.querySelectorAll('.dropdown-btn').forEach(function(b) { b.classList.remove('open'); });
  if (!isOpen) { el.style.display="block"; btn.classList.add('open'); }
}

var pdfModalScrollY = 0;
function openPdf(event, url) {
  event.preventDefault();
  var viewerBase = new URL('../assets/pdfjs/web/viewer.html', window.location.href).href;
  var viewerSrc = viewerBase + '?file=' + encodeURIComponent(url);
  pdfModalScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  document.getElementById('pdfModalFrame').src = viewerSrc;
  document.getElementById('pdfModalOpenNewTab').href = viewerSrc;
  document.getElementById('pdfModalOverlay').classList.add('open');
  document.body.style.position = 'fixed';
  document.body.style.top = '-' + pdfModalScrollY + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.overflow = 'hidden';
  return false;
}
function closePdfModal(event) {
  if (event) event.stopPropagation();
  document.getElementById('pdfModalOverlay').classList.remove('open');
  document.getElementById('pdfModalFrame').src = '';
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.overflow = '';
  window.scrollTo(0, pdfModalScrollY);
}

/* =========================================================================

   ci-dessous (n'oubliez pas la virgule après l'accolade précédente).

   Champs :
     classe      : 'prepa'  ou  'episen'
     type        : 'dm'  |  'td'  |  'interro'  |  'tp'  |  'colle'
     titre       : court, affiché dans le calendrier
     date        : format 'AAAA-MM-JJ' (date à laquelle le devoir est dû /
                   a lieu — c'est ce qui détermine sa position dans le
                   calendrier)
     description : texte libre, affiché uniquement dans la fenêtre de détail

     lien        : URL vers un PDF (sujet, énoncé...) ou un lien externe

let currentClasse = 'prepa';

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseKey(key) { const p = key.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function mondayOf(date) { const d = new Date(date); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); d.setHours(0,0,0,0); return d; }
function typeLabel(t) { return { dm:'DM', td:'TD', interro:'Interrogation', tp:'TP', colle:'Colle' }[t] || t; }
function escapeHtml(s) { const div = document.createElement('div'); div.textContent = s == null ? '' : s; return div.innerHTML; }
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function devoirsForClasse() { return devoirs.filter(d => d.classe === currentClasse); }
function devoirsOnDate(key) { return devoirsForClasse().filter(d => d.date === key); }

function setClasse(classe, btn) {
  currentClasse = classe;
  document.querySelectorAll('.classe-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCalendar();
}
function setView(view, btn) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCalendar();
}
function navigate(delta) {
  const d = new Date(currentDate);
  if (currentView === 'month') { d.setMonth(d.getMonth() + delta); }
  else { d.setDate(d.getDate() + delta * 7); }
  currentDate = d;
  renderCalendar();
}
function goToday() { currentDate = new Date(); renderCalendar(); }

function renderCalendar() {
  if (currentView === 'month') renderMonth(); else renderWeek();
}

function renderMonth() {
  const year = currentDate.getFullYear(), month = currentDate.getMonth();
  document.getElementById('calLabel').textContent = capitalize(currentDate.toLocaleDateString('fr-FR', { month:'long', year:'numeric' }));

  const start = mondayOf(new Date(year, month, 1));
  const todayKey = dateKey(new Date());
  const weekdays = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

  let html = '<div class="month-grid">';
  weekdays.forEach(w => html += '<div class="month-weekday">' + w + '</div>');

  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = dateKey(d);
    const inMonth = d.getMonth() === month;
    const items = devoirsOnDate(key);
    let cls = 'cal-day';
    if (!inMonth) cls += ' other-month';
    if (key === todayKey) cls += ' today';
    if (items.length) cls += ' has-devoirs';

    html += '<div class="' + cls + '"' + (items.length ? ' onclick="openDevoirDetail(\'' + key + '\')"' : '') + '>';
    html += '<span class="day-num">' + d.getDate() + '</span>';
    if (items.length) {
      html += '<div class="day-badges">';
      items.slice(0, 3).forEach(it => {
        html += '<div class="day-badge ' + it.type + '" title="' + escapeHtml(it.titre) + '">' + escapeHtml(it.titre) + '</div>';
      });
      if (items.length > 3) html += '<div class="day-more">+' + (items.length - 3) + ' autre(s)</div>';
      html += '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('calendarContainer').innerHTML = html;
}

function renderWeek() {
  const monday = mondayOf(currentDate);
  const days = [];
  for (let i = 0; i < 7; i++) { const d = new Date(monday); d.setDate(monday.getDate() + i); days.push(d); }
  const startLabel = days[0].toLocaleDateString('fr-FR', { day:'numeric', month: days[0].getMonth() === days[6].getMonth() ? undefined : 'long' });
  const endLabel = days[6].toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
  document.getElementById('calLabel').textContent = capitalize(startLabel + ' – ' + endLabel);

  const weekdays = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
  const todayKey = dateKey(new Date());

  let html = '<div class="week-grid">';
  days.forEach((d, i) => {
    const key = dateKey(d);
    const items = devoirsOnDate(key);
    const isToday = key === todayKey;
    html += '<div class="week-col' + (isToday ? ' today' : '') + '">';
    html += '<div class="week-col-header"><div class="wd">' + weekdays[i] + '</div><div class="wn">' + d.getDate() + '</div></div>';
    html += '<div class="week-col-body">';
    if (items.length) {
      items.forEach(it => {
        html += '<div class="week-devoir-card ' + it.type + '" onclick="openDevoirDetail(\'' + key + '\')">';
        html += '<div class="week-devoir-type">' + typeLabel(it.type) + '</div>';
        html += '<div class="week-devoir-title">' + escapeHtml(it.titre) + '</div>';
        html += '</div>';
      });
    } else {
      html += '<div class="week-empty">—</div>';
    }
    html += '</div></div>';
  });
  html += '</div>';
  document.getElementById('calendarContainer').innerHTML = html;
}

function openDevoirDetail(key) {
  const items = devoirsOnDate(key);
  if (!items.length) return;
  const d = parseKey(key);
  document.getElementById('devoirModalTitle').textContent = d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  let html = '';
  items.forEach(it => {
    html += '<div class="devoir-detail-card ' + it.type + '">';
    html += '<div class="devoir-detail-type">' + typeLabel(it.type) + '</div>';
    html += '<div class="devoir-detail-title">' + escapeHtml(it.titre) + '</div>';
    if (it.description) html += '<div class="devoir-detail-desc">' + escapeHtml(it.description) + '</div>';
    if (it.lien) {
      if (it.lien.toLowerCase().endsWith('.pdf')) {
        html += '<a class="devoir-detail-link" href="' + it.lien + '" onclick="return openPdf(event, this.href)"><i class="fa fa-file-pdf-o"></i> Voir le sujet</a>';
      } else {
        html += '<a class="devoir-detail-link" href="' + it.lien + '" target="_blank" rel="noopener"><i class="fa fa-external-link"></i> Lien</a>';
      }
    }
    html += '</div>';
  });
  document.getElementById('devoirModalBody').innerHTML = html;
  document.getElementById('devoirModalOverlay').classList.add('open');
}
function closeDevoirModal(event) {
  if (event) event.stopPropagation();
  document.getElementById('devoirModalOverlay').classList.remove('open');
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeDevoirModal(); closePdfModal(); }
});

renderCalendar();
</script>
</body>
</html>
